<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DSH Desktop Min</title>
<!--
  接管页（splash）：下载 / 校验 / 重启引擎期间，窗口里显示的就是这一页。

  它不是 dsh 的一部分，也不由 dsh 提供 —— 它和 main.js 一起打进 App，
  用 file:// 加载。所以引擎正在被换掉、后端根本不存在的这段时间里，
  它照样能渲染。

  和 dsh 页面的关系：主进程先 loadFile 这一页，等新后端从 stdout 报出 URL，
  再 loadURL 切回 dsh。整个过程中窗口本身、菜单、通知都没动过。

  数据通道是单向的：主进程用 executeJavaScript 调用 window.__dshSplash.update()。
  这里刻意不做 preload / IPC —— 那个窗口的 webPreferences 是为**远端** dsh 页面
  设的（sandbox + contextIsolation + 无 preload），给本地页面开 IPC 就等于给
  远端页面也开了一个洞。
-->
<style>
  :root {
    --bg: #ffffff;
    --fg: #171513;
    --muted: #8a8580;
    --line: #e8e5e1;
    --track: #eeeae6;
    --accent: #171513;
    --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171513;
      --fg: #f2efec;
      --muted: #8c8681;
      --line: #2a2622;
      --track: #262220;
      --accent: #f2efec;
      --err: #ff6b5e;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font: 13px/1.6 -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
    /* 隐藏标题栏后红绿灯浮在内容之上，这里自己留出顶部空间（dsh 页面靠注入 CSS 让位，
       接管页得自己处理），同时整页可拖动窗口。 */
    -webkit-app-region: drag;
    -webkit-user-select: none; user-select: none;
  }
  .wrap {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 72px 48px 48px; text-align: center;
  }
  .mark { width: 76px; height: 76px; margin-bottom: 20px; }
  .mark svg { width: 100%; height: 100%; display: block; }
  .mark path { fill: var(--accent); }
  h1 {
    font-size: 15px; font-weight: 600; letter-spacing: .02em;
    margin: 0 0 4px;
  }
  .version { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .phase {
    margin: 28px 0 10px; font-size: 14px; font-weight: 500; min-height: 22px;
  }
  .bar {
    width: 260px; height: 3px; border-radius: 2px;
    background: var(--track); overflow: hidden; position: relative;
  }
  .bar > i {
    position: absolute; inset: 0 auto 0 0; width: 0%;
    background: var(--accent); border-radius: 2px;
    transition: width .25s ease;
  }
  /* 进度未知时（下载总大小拿不到、冷启动无进度）走不确定态走马灯 */
  .bar.indeterminate > i {
    width: 35% !important;
    animation: slide 1.15s ease-in-out infinite;
    transition: none;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(385%); }
  }
  .detail {
    margin: 12px 0 0; color: var(--muted); font-size: 12px;
    min-height: 19px; max-width: 460px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .steps {
    list-style: none; margin: 26px 0 0; padding: 0;
    display: flex; gap: 22px; font-size: 12px; color: var(--muted);
  }
  .steps li { display: flex; align-items: center; gap: 6px; }
  .steps .dot {
    width: 13px; height: 13px; border-radius: 50%;
    border: 1.5px solid var(--line); flex: none;
    display: grid; place-items: center;
    font-size: 9px; line-height: 1;
  }
  .steps li[data-status="running"] { color: var(--fg); }
  .steps li[data-status="running"] .dot { border-color: var(--fg); }
  .steps li[data-status="passed"] .dot {
    border-color: var(--accent); background: var(--accent); color: var(--bg);
  }
  .steps li[data-status="failed"] { color: var(--err); }
  .steps li[data-status="failed"] .dot { border-color: var(--err); color: var(--err); }
  .error {
    margin-top: 22px; max-width: 520px; color: var(--err);
    font-size: 12px; white-space: pre-wrap; text-align: left;
    display: none;
  }
  .error.show { display: block; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">
      <!-- 官方鲸鱼（dsh-web-frontend/dist/favicon.svg），只改填充色 -->

      </svg>
    </div>
    <h1>DSH Desktop Min</h1>
    <div class="version" id="version"></div>

    <div class="phase" id="phase">正在启动引擎…</div>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div class="detail" id="detail"></div>

    <ul class="steps" id="steps"></ul>
    <div class="error" id="error"></div>
  </div>

<script>
  const el = {
    version: document.getElementById('version'),
    phase: document.getElementById('phase'),
    bar: document.getElementById('bar'),
    fill: document.getElementById('fill'),
    detail: document.getElementById('detail'),
    steps: document.getElementById('steps'),
    error: document.getElementById('error')
  }

  let stepNames = []
  let stepStatus = []

  function renderSteps() {
    el.steps.innerHTML = ''
    stepNames.forEach((name, i) => {
      const status = stepStatus[i] || 'pending'
      const li = document.createElement('li')
      li.dataset.status = status
      const dot = document.createElement('span')
      dot.className = 'dot'
      dot.textContent = status === 'passed' ? '\u2713' : status === 'failed' ? '\u2715' : ''
      li.appendChild(dot)
      li.appendChild(document.createTextNode(name))
      el.steps.appendChild(li)
    })
  }

  window.__dshSplash = {
    update(state) {
      if (!state) return
      if (state.version !== undefined) el.version.textContent = state.version
      if (state.phase !== undefined) el.phase.textContent = state.phase
      if (state.detail !== undefined) el.detail.textContent = state.detail

      // percent 是 null/undefined 时走不确定态
      const known = typeof state.percent === 'number' && isFinite(state.percent)
      el.bar.classList.toggle('indeterminate', !known)
      if (known) el.fill.style.width = Math.max(0, Math.min(100, state.percent)) + '%'

      if (Array.isArray(state.steps)) {
        stepNames = state.steps.map((s) => s.name)
        stepStatus = state.steps.map((s) => s.status)
        renderSteps()
      }
      if (state.error !== undefined) {
        el.error.textContent = state.error || ''
        el.error.classList.toggle('show', Boolean(state.error))
      }
    }
  }
</script>
</body>
</html>
