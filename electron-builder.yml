# electron-builder 打包配置
#
# 关于 asar：**故意关闭**。
#
# 自带引擎的启动方式是 `node <bin.js>` —— 用 App 里那个真正的 node 二进制去加载
# dsh 的入口。而 node 二进制不认识 asar 虚拟文件系统（那是 Electron 自己给它的
# Node 加的能力），所以只要 bin.js 或它 require 的模块被塞进 app.asar，启动就会
# 失败。同理，node 二进制本身也必须在真实文件系统上、且带可执行位。
#
# 关掉 asar 后一切都在真实路径上，代价只是目录结构不如单文件紧凑、启动略慢——
# 换来的是「自带引擎能可靠启动」。
asar: false

# 关掉 electron-builder 的原生模块重建（@electron/rebuild）。
#
# 这是**架构决定**，不是为了绕过一个报错：
#   1. 这个 App 里 **Electron 自己不加载任何原生模块** —— dsh 引擎跑在一个真实的
#      node 子进程里（见 README「为什么必须带一个真正的 Node」）。把原生模块按
#      Electron 的 ABI 重建，反而会让引擎在真 node 下加载失败：ABI 对不上。
#   2. 没有 Python / VS Build Tools 的机器上，重建会让打包直接失败（实测 node-pty
#      会走 node-gyp，报 "Could not find any Python installation to use"）。
# 代价要说清楚：引擎里那些依赖预编译二进制的可选功能（例如终端的 node-pty）不会
# 在打包阶段被构建 —— 它们由 dsh 自己的 plugin 命令在运行时处理。
npmRebuild: false

appId: com.dsh.desktopmin
productName: DSH Desktop Min

directories:
  output: release
  buildResources: build

# 打包进 App 的内容：壳自己 + 自带引擎（node 运行时、@deepseek-ai/dsh 及其依赖）
files:
  - main.js
  # platform.js 是 main/updater/plugin-installer/watchdog 共同依赖的平台差异层。
  # 漏了它 = 打包版启动即崩（require 找不到模块）。新增共享模块时记得一起加。
  - platform.js
  - updater.js
  - plugin-installer.js
  - notify.js
  - watchdog.js
  - output-lines.js
  - runtime-paths.js
  # Desktop 专用的 DSH 官方组合覆盖层：把工作区选择器留在应用内。
  - desktop-directory-picker.patch.yml
  # 接管页：下载 / 校验 / 重启引擎期间窗口里显示的就是它。
  # 漏了它 = 升级时窗口会切到一个不存在的文件 → 白屏。
  - splash.html
  - setup.html
  # Windows 托盘图标：菜单栏收起后托盘是主要入口，运行时要从这里读图。
  # （macOS 不做托盘，图标走 mac.icon 的 icns，不需要这个文件。）
  - build/icon.png
  - package.json
  # 引擎那一棵（@deepseek-ai/*）**交给下面的 extraResources 原样拷贝**，这里排除掉，
  # 避免重复拷贝（也顺手绕开依赖收集器对它的裁剪）。
  - "!node_modules/@deepseek-ai/**"

# ── 引擎整棵原样拷贝 ─────────────────────────────────────────────────────
#
# 为什么不能靠 electron-builder 自动收集依赖（这是实测出来的真 bug）：
#
#   引擎的插件在 lockfile 里是 **peerDependencies**（`"peer": true`，而且没有任何
#   条目把其中大多数声明为普通 dependencies）。npm 7+ 会把 peer 依赖自动装到顶层，
#   所以 `npm start` 一切正常；而 electron-builder 的依赖收集器**只跟 dependencies**，
#   于是实测有 24 个 @deepseek-ai/* 包没进安装包 —— 包括 dsh-app-boot 无条件 import 的
#   `@deepseek-ai/cordis-plugin-group`。
#
#   后果极隐蔽：`release/win-unpacked` 放在仓库目录里时，Node 的模块解析会**向上回溯**
#   命中仓库开发态的 node_modules，看起来一切正常；一旦装到程序目录（或 mac 的 DMG
#   挂到 /Applications），这条退路没有了，应用直接起不来：
#       Error [ERR_MODULE_NOT_FOUND]: Cannot find package '@deepseek-ai/cordis-plugin-group'
#   也就是说，只测 unpacked、不测安装版，是发现不了这个问题的。
#
# 所以这里不走收集器：引擎整棵原样进包。这也和本项目的架构一致 —— 引擎是用
# **自带的真 node** 跑的独立 Node 应用（见 README「为什么必须带一个真正的 Node」），
# 它按 Node 的常规解析规则找依赖，那棵树的完整性必须由我们保证。
extraResources:
  - from: node_modules/@deepseek-ai
    to: app/node_modules/@deepseek-ai
    filter:
      - "**/*"

# 这些不进包：诊断脚本、图标源文件（App 运行时用不到）
extraMetadata:
  main: main.js

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]

  # 用 ad-hoc 签名（不需要开发者证书）。
  #
  # 为什么不能设成 null：那样 electron-builder 会完全跳过签名，二进制只留下链接器的
  # 临时签名（codesign 显示 flags=adhoc,linker-signed、Identifier=Electron）。实测在这种
  # 状态下 macOS 会拒绝投递通知，报 UNErrorDomain 错误 1；改成正确的 ad-hoc 签名
  # （Identifier = 本 bundle id）之后通知立刻可用。
  #
  # 仍然没有公证，所以分发时对方首次打开需要右键 → 打开，或清一次隔离属性。
  identity: '-' 

  # 深色模式下的窗口底色由应用自己处理
  darkModeSupport: true

dmg:
  title: DSH Desktop Min
  # 不做公证，保持简单
  sign: false

# ── Windows ─────────────────────────────────────────────────────────────
#
# 为什么只出 nsis、不出 portable：
#   Windows 的 toast 通知要求进程有 AppUserModelID，**并且系统里存在与之匹配的开始
#   菜单快捷方式**。nsis 安装包会建这个快捷方式，portable / 直接解压运行的目录不会 ——
#   那种情况下 `Notification.isSupported()` 照样返回 true，但投递会被系统静默丢弃。
#   和 mac 那边「必须 ad-hoc 签名否则通知发不出来」是同一类约束，所以这里选安装版。
#
# 为什么用 1024×1024 的 png 而不是手写 .ico：
#   electron-builder 会自己转出多尺寸 ico。build/icon.png 是现成的 1024 方图。
#
# 为什么 perMachine: false：
#   每用户安装，不需要管理员权限 —— 而这正是原先卡住插件向导的那类环境
#   （没有管理员、也没开开发者模式）。
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  # 不用一键安装：给用户一个能选目录的正常安装向导
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # 通知依赖它，不要关
  createStartMenuShortcut: true
  createDesktopShortcut: true
  shortcutName: DSH Desktop Min
  # 与已发布的 macOS 资产命名保持一致（点号分隔 + 架构）：
  #   DSH.Desktop.Min-0.5.0-x64-setup.exe
  #   DSH.Desktop.Min-0.5.0-arm64.dmg
  # 默认模板会用 productName（带空格），GitHub 上会变成 %20，看着别扭。
  artifactName: DSH.Desktop.Min-${version}-x64-setup.${ext}

# 关掉自动更新：这个 App 的更新方式是「原生菜单栏从 npm 拉引擎」（见 README 的「引擎」一节），
# 不是 electron-builder 的发布通道。
publish: null
