# electron-builder 打包配置
#
# 关于 asar：**故意关闭**。
#
# 自带引擎的启动方式是 `node <bin.js>` —— 用 App 里那个真正的 node 二进制去加载
# dsh 的入口。而 node 二进制不认识 asar 虚拟文件系统（那是 Electron 自己给它的
# Node 加的能力），所以只要 bin.js 或它 require 的模块被塞进 app.asar，启动就会
# 失败。同理，node 二进制本身也必须在真实文件系统上、且带可执行位。
#
# 关掉 asar 后一切都在真实路径上，代价只是目录结构不如单文件紧凑、启动略慢——
# 换来的是「自带引擎能可靠启动」。
asar: false

appId: com.dsh.desktopmin
productName: DSH Desktop Min

directories:
  output: release
  buildResources: build

# 打包进 App 的内容：壳自己 + 自带引擎（node 运行时、@deepseek-ai/dsh 及其依赖）
files:
  - main.js
  - updater.js
  - plugin-installer.js
  - notify.js
  - watchdog.js
  - output-lines.js
  # 接管页：下载 / 校验 / 重启引擎期间窗口里显示的就是它。
  # 漏了它 = 升级时窗口会切到一个不存在的文件 → 白屏。
  - splash.html
  - setup.html
  - package.json

# 这些不进包：诊断脚本、图标源文件（App 运行时用不到）
extraMetadata:
  main: main.js

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]

  # 用 ad-hoc 签名（不需要开发者证书）。
  #
  # 为什么不能设成 null：那样 electron-builder 会完全跳过签名，二进制只留下链接器的
  # 临时签名（codesign 显示 flags=adhoc,linker-signed、Identifier=Electron）。实测在这种
  # 状态下 macOS 会拒绝投递通知，报 UNErrorDomain 错误 1；改成正确的 ad-hoc 签名
  # （Identifier = 本 bundle id）之后通知立刻可用。
  #
  # 仍然没有公证，所以分发时对方首次打开需要右键 → 打开，或清一次隔离属性。
  identity: '-' 

  # 深色模式下的窗口底色由应用自己处理
  darkModeSupport: true

dmg:
  title: DSH Desktop Min
  # 不做公证，保持简单
  sign: false

# 关掉自动更新：这个 App 的更新方式是「原生菜单栏从 npm 拉引擎」（见 README 的「引擎」一节），
# 不是 electron-builder 的发布通道。
publish: null
